<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> brki hna</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f0f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        .header-container {
            margin-top: 50px;
            text-align: center;
            z-index: 10;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.8rem;
            margin-bottom: 15px;
        }

        p {
            color: #34495e;
            font-size: 1.4rem;
            max-width: 650px;
            padding: 0 20px;
        }

        #anti-gravity-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 18px 36px;
            font-size: 1.6rem;
            font-weight: bold;
            color: white;
            background-color: #3498db;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.4);
            transition: top 0.15s ease-out, left 0.15s ease-out;
            z-index: 20;
        }

        /* Prank Container */
        #prank-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* YouTube Iframe Wrapper */
        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 
             pointer-events: none stops her from pausing the video by clicking on it!
            */
            pointer-events: none; 
            transition: opacity 0.5s;
        }

        #scary-media {
            width: 100%;
            height: 100%;
            border: none;
        }

        #meme-text {
            position: absolute;
            display: none;
            color: #ffeb3b;
            font-size: 4.5rem;
            font-weight: 900;
            text-align: center;
            text-shadow: 4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 0 0 30px #000;
            z-index: 10000;
            padding: 20px;
            animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

    </style>
</head>
<body>

    <div class="header-container">
        <h1>Anti-Gravity Button Test for Saloua</h1>
        <p>Saloua, try to catch the Anti-Gravity button to unlock your mystery gift!</p>
    </div>

    <button id="anti-gravity-btn">Claim Gift</button>

    <div id="prank-container">
        <div class="video-wrapper" id="video-wrapper">
            <!-- YouTube API will automatically insert the iframe here -->
            <div id="scary-media"></div>
        </div>
        
        <div id="meme-text">Tsaaydti a Saloua! 🤣<br><span style="font-size: 2.5rem; color: white;">Just a prank!</span></div>
    </div>

    <!-- YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        
        // This function is called automatically when the YouTube API script loads
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('scary-media', {
                videoId: 'E9nqJFjUPQA', // The video ID from your link
                playerVars: {
                    'autoplay': 0,      // Do not play until clicked
                    'controls': 0,      // Hide player controls
                    'start': 6,         // Start exactly at 6 seconds as requested
                    'rel': 0,           // Disable related videos
                    'showinfo': 0,
                    'modestbranding': 1,
                    'disablekb': 1,
                    'fs': 0,
                    'playsinline': 1
                }
            });
        }

        const btn = document.getElementById('anti-gravity-btn');
        let prankTriggered = false;

        // --- Button Evasion Logic ---
        window.addEventListener('mousemove', (e) => {
            if (prankTriggered) return;

            const mouseX = e.clientX;
            const mouseY = e.clientY;
            
            const btnRect = btn.getBoundingClientRect();
            const btnX = btnRect.left + btnRect.width / 2;
            const btnY = btnRect.top + btnRect.height / 2;

            const distance = Math.sqrt(Math.pow(mouseX - btnX, 2) + Math.pow(mouseY - btnY, 2));

            if (distance < 180) {
                const padding = 50; 
                const maxX = window.innerWidth - btnRect.width - padding;
                const maxY = window.innerHeight - btnRect.height - padding;
                
                const newX = Math.max(padding, Math.random() * maxX);
                const newY = Math.max(padding, Math.random() * maxY);
                
                btn.style.left = `${newX + btnRect.width/2}px`;
                btn.style.top = `${newY + btnRect.height/2}px`;
            }
        });

        // --- Prank Trigger Logic ---
        document.body.addEventListener('click', triggerPrank);

        function triggerPrank() {
            if (prankTriggered) return;
            prankTriggered = true;

            const prankContainer = document.getElementById('prank-container');
            const memeText = document.getElementById('meme-text');
            const videoWrapper = document.getElementById('video-wrapper');

            // 1. Enter Fullscreen for maximum scare
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) docElm.requestFullscreen().catch(e => console.log(e));
            else if (docElm.webkitRequestFullScreen) docElm.webkitRequestFullScreen();
            else if (docElm.msRequestFullscreen) docElm.msRequestFullscreen();

            // 2. Show the black overlay container
            prankContainer.style.display = 'flex';
            
            // 3. Command the YouTube player to play instantly
            // Because this is triggered by a user's click gesture, the browser will allow the sound to play!
            if (player && typeof player.playVideo === 'function') {
                player.playVideo();
            }

            // 4. After 3 seconds, show the Darija text and pause the scare
            setTimeout(() => {
                memeText.style.display = 'block';
                videoWrapper.style.opacity = '0.3'; // Dim the video background
                
                if (player && typeof player.pauseVideo === 'function') {
                    player.pauseVideo();
                }
            }, 3000); 
        }
    </script>
</body>
</html>
