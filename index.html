<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saloua's Antigravity Playground</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .container {
            padding: 2rem;
            max-width: 600px;
            z-index: 10;
        }

        h1 {
            font-size: 2.5rem;
            color: #38bdf8;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 2.5rem;
            line-height: 1.6;
            color: #94a3b8;
        }

        button {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 15px 35px -5px rgba(239, 68, 68, 0.7);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Fullscreen Prank Overlay */
        #prank-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #middle-finger {
            font-size: 15rem;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 10px;
        }

        #joke-message {
            color: #fde047;
            font-size: 4.5rem;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(0, 0, 0, 1), 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
            padding: 20px;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.1s both;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Background grid effect for "physics simulator" vibe */
        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <div class="container" id="main-ui">
        <h1>welcome saloua</h1>
        <p>Welcome to the advanced physics environment. Please initialize the gravitational field test module.</p>
        <button id="trigger-btn">Calibrate Gravity</button>
    </div>

    <!-- The hidden prank overlay -->
    <div id="prank-overlay">
        <div id="middle-finger">🖕</div>
        <div id="joke-message"> fuck you<br>!!!!!!</div>
    </div>

    <script>
        const triggerBtn = document.getElementById('trigger-btn');
        const prankOverlay = document.getElementById('prank-overlay');
        const mainUi = document.getElementById('main-ui');

        triggerBtn.addEventListener('click', () => {
            // 1. Request Fullscreen to trap the user
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) docElm.requestFullscreen().catch(e => console.log(e));
            else if (docElm.webkitRequestFullScreen) docElm.webkitRequestFullScreen();
            else if (docElm.msRequestFullscreen) docElm.msRequestFullscreen();

            // 2. Hide Main UI, Show Overlay with the emoji and joke
            mainUi.style.display = 'none';
            prankOverlay.style.display = 'flex';
        });
    </script>
</body>
</html>
